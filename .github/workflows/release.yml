name: Release

# 推送 v*.*.* tag 时自动发布到两个渠道：
#   - npm：用 OIDC Trusted Publishing，无需 token、永不过期（需先在
#     npmjs.com 的 cursor-feedback 包设置里把本仓库配成 Trusted Publisher）
#   - Open VSX：用 PAT（仓库 Secrets 配 OVSX_PAT），没配则跳过
# 发版流程：npm run release:<patch|minor|major> && git push --follow-tags

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write # npm trusted publishing 用的 OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # 打包 .vsix 供 Open VSX 发布使用
      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"

      # npm Trusted Publishing 需要较新的 npm CLI（OIDC 支持）
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish to npm (Trusted Publishing)
        run: npm publish
